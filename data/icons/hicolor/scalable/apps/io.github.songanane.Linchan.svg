<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#57e389"/>
      <stop offset="1" stop-color="#26a269"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e5e2"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9f3d1"/>
      <stop offset="1" stop-color="#dcfae9"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <clipPath id="pic"><rect x="34" y="36" width="60" height="46" rx="6"/></clipPath>
  </defs>
  <!-- soft shadow -->
  <rect x="10" y="13" width="108" height="108" rx="26" fill="#000000" opacity="0.28" filter="url(#shadow)"/>
  <!-- tile with a subtle top highlight -->
  <rect x="8" y="8" width="112" height="112" rx="26" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="25.5" fill="none" stroke="url(#shine)" stroke-width="1.5"/>
  <!-- speech bubble -->
  <path d="M36 26 H92 A12 12 0 0 1 104 38 V80 A12 12 0 0 1 92 92 H56 L40 106 V92 H36 A12 12 0 0 1 24 80 V38 A12 12 0 0 1 36 26 Z"
        fill="url(#bubble)"/>
  <!-- the picture in the post -->
  <g clip-path="url(#pic)">
    <rect x="34" y="36" width="60" height="46" fill="url(#sky)"/>
    <circle cx="79" cy="49" r="6" fill="#f6d32d"/>
    <path d="M34 82 L55 52 L69 71 L77 61 L94 82 Z" fill="#26a269"/>
    <path d="M55 52 L62 62 L57 65 L52 57 Z" fill="#33d17a" opacity="0.8"/>
  </g>
</svg>
